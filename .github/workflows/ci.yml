name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Small real-world corpus for the M4 validation matrix (skipped if missing).
      - name: Fetch Canterbury corpus
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -File scripts/fetch_corpus.ps1 canterbury
          else
            scripts/fetch_corpus.sh canterbury
          fi
        continue-on-error: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # GPU integration tests skip themselves when the runner has no adapter.
      - run: cargo test --workspace -- --nocapture
      - name: Adapter info (informational)
        run: cargo run -p cli -- info
        continue-on-error: true
