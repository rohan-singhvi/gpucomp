[workspace]
resolver = "2"
members = ["crates/format", "crates/cpu", "crates/gpu", "crates/bench", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
repository = "https://github.com/rohan-singhvi/gpucomp"

[workspace.dependencies]
wgpu = "=30.0.1"
pollster = "=1.0.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
clap = { version = "=4.6.7", features = ["derive"] }
log = "=0.4.34"
env_logger = "=0.11.11"
anyhow = "=1.0.104"
thiserror = "=2.0.21"
lz4_flex = "=0.14.0"
rayon = "=1.12.0"
xxhash-rust = { version = "=0.8.19", features = ["xxh3"] }
proptest = "=1.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
