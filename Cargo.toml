[workspace]
resolver = "2"
members = ["crates/gpu", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
repository = "https://github.com/rohan-singhvi/gpucomp"

[workspace.dependencies]
wgpu = "=30.0.1"
pollster = "=1.0.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
clap = { version = "=4.6.7", features = ["derive"] }
log = "=0.4.34"
env_logger = "=0.11.11"
anyhow = "=1.0.104"
thiserror = "=2.0.21"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
